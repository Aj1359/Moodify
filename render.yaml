# Render blueprint for the Moodify backend.
# Render dashboard -> New -> Blueprint -> pick this repository. Render reads this file,
# creates the service and asks for every value marked `sync: false`.
# Full walkthrough: docs/deployment.md
services:
  - type: web
    name: moodify-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_DAILY_LIMIT
        value: "450"
      - key: LLM_USER_PER_MINUTE
        value: "10"
