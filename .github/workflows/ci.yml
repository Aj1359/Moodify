name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests and keyword evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Keyword fallback accuracy on the 144-sentence benchmark
        run: npm run eval

  mobile:
    name: Mobile type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: EXPO_PUBLIC variables are read directly
        # Expo inlines EXPO_PUBLIC_* only for process.env.EXPO_PUBLIC_NAME. Any other
        # read compiles to undefined on a phone build, so fail on it here.
        run: |
          if grep -rnE 'process\.env' src app | grep -vE 'process\.env\.(EXPO_PUBLIC_[A-Z0-9_]+|NODE_ENV)\b'; then
            echo "Read env vars as process.env.EXPO_PUBLIC_NAME so Expo can inline them."
            exit 1
          fi
